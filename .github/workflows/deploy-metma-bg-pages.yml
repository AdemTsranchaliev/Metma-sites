name: Deploy metma-bg to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "metma-bg/**"
      - ".github/workflows/deploy-metma-bg-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-metma-bg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metma-bg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: metma-bg/package-lock.json
      - run: npm ci
      - run: npm run build:gh-pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/Metma-sites"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: metma-bg/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

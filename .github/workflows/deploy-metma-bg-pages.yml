name: Deploy metma-bg to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "metma-bg/**"
      - "metma-mehanizmi/**"
      - ".github/workflows/deploy-metma-bg-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-metma-bg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            metma-bg/package-lock.json
            metma-mehanizmi/package-lock.json
      - run: npm ci
        working-directory: metma-bg
      - run: npm run build:gh-pages
        working-directory: metma-bg
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/Metma-sites"
      - name: Build furniture mechanisms site
        working-directory: metma-mehanizmi
        run: npm ci && npm run build:gh-pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/Metma-sites/mehanizmi"
      - name: Nest mechanisms pages under /mehanizmi
        working-directory: .
        run: rm -rf metma-bg/out/mehanizmi && mkdir -p metma-bg/out/mehanizmi && cp -R metma-mehanizmi/out/. metma-bg/out/mehanizmi/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: metma-bg/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
